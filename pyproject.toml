[project]
name = "demoflow1"
version = "0.1.0"
description = "demoflow1 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.121.1,<1.0.0",
]

[project.scripts]
kickoff = "demoflow1.main:kickoff"
run_crew = "demoflow1.main:kickoff"
plot = "demoflow1.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
