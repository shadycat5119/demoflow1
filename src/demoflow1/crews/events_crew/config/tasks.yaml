events_search:
  description: >
    Research and identify the top 20 most reliable news and event sources for the target company.
    Focus on business news sites, company press releases, industry publications, and social media.
    Prioritize sources with verified news and regular updates.
  expected_output: >
    A ranked list of top 20 news and event sources, including:
    - Website URL and name
    - Type of source (news site, press release, social media, etc.)
    - Content quality rating
    - Event types covered
    - Update frequency
  agent: events_searcher

events_scrape:
  description: >
    Carefully extract news and event information from the top 20 identified sources.
    Focus on recent developments, announcements, and significant events.
    Respect website terms of service and avoid deep scraping.
  expected_output: >
    Structured event data from each source including:
    - Event/News title and date
    - Event type and category
    - Key details and impact
    - Related parties involved
    - Source URL and timestamp
  agent: events_scraper

events_compile:
  description: >
    Compile and cross-reference event information from all sources.
    Verify consistency and accuracy of event details.
    Organize data by event type and timeline.
  expected_output: >
    A verified events timeline report containing:
    - Chronological event listing
    - Cross-referenced event details
    - Impact analysis
    - Source citations and confidence levels
  agent: events_compiler
