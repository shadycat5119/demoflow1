people_search:
  description: >
    Research and identify the top 20 most reliable websites containing information about the target company's executives and team members.
    Focus on official company websites, LinkedIn, business news sites, and professional networks.
    Prioritize sources with verified and up-to-date information.
  expected_output: >
    A ranked list of top 20 information sources, including:
    - Website URL and name
    - Type of source (official, news, professional network, etc.)
    - Information quality rating
    - Key executives/team members covered
    - Last update date
  agent: people_searcher

people_scrape:
  description: >
    Carefully extract information from the top 20 identified websites.
    Focus on publicly available information about executives and key team members.
    Respect website terms of service and avoid deep scraping.
  expected_output: >
    Structured data from each source including:
    - Executive names and titles
    - Current roles and responsibilities
    - Professional background highlights
    - Recent achievements and activities
    - Source URL and timestamp
  agent: people_scraper

people_compile:
  description: >
    Compile and cross-reference information from all sources.
    Remove duplicates and verify accuracy.
    Organize data by executive level and department.
  expected_output: >
    A verified executive profile report containing:
    - Cross-referenced executive information
    - Department-wise team structure
    - Key responsibilities and achievements
    - Source citations and confidence levels
  agent: people_compiler
