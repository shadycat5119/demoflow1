format_content:
  description: >
    Compile and format all verified company information into a comprehensive report.
    Use the cross-referenced data from all crews to create a cohesive narrative.
    Include source citations and confidence levels for all information.
  expected_output: >
    A comprehensive company report containing:
    - Executive summary with key findings
    - Financial analysis with verified metrics
    - Executive profiles with cross-referenced data
    - Recent events timeline with impact analysis
    - Source citations and confidence levels
  agent: formatter

write_file:
  description: >
    Write the final report to a markdown file with proper formatting and structure.
    Include a bibliography of all sources used.
    Ensure all sections are properly organized and formatted.
  expected_output: >
    A well-formatted markdown file (lastreport.md) containing:
    - Complete company report
    - Source bibliography
    - Confidence level indicators
    - Last updated timestamp
  agent: file_writer
